<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap3d</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0f'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%237dd3c0' stroke-width='2.5'/%3E%3Ccircle cx='12.5' cy='12.5' r='2.6' fill='%237dd3c0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /*
   * The design system below is lifted deliberately from modelviewer.dev: Rubik for
   * prose and headings, Roboto Mono for anything that is actually code, a soft-black
   * text colour at 87% opacity rather than pure #000 (Material Design's own reasoning
   * - pure black against white is harsher than text needs to be), a single coral
   * accent for every link, and a two-column layout with the live demo pinned in a
   * sticky right column while the left column explains it. Only the content below is
   * this project's; the type scale, colours and layout mechanics are theirs.
   */
  :root {
    --font-sans: 'Rubik', sans-serif;
    --font-mono: 'Roboto Mono', monospace;
    --text: rgba(0, 0, 0, 0.87);
    --text-2: rgba(0, 0, 0, 0.6);
    --accent: #ff5252;
    --code-bg: rgba(0, 0, 0, 0.04);
    --border: rgba(0, 0, 0, 0.12);
    --bg: #ffffff;
    /* Syntax colours for a light background - GitHub-light-ish, and none of them the
       same red as --accent, so a link and a keyword never read as the same thing. */
    --c-tag: #2e7d32; --c-attr: #6a1b9a; --c-str: #c2410c; --c-kw: #1565c0; --c-punct: rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a.link-underline { text-decoration: underline; }
  code, pre, select { font-family: var(--font-mono); }
  p { margin: 0 0 14px; }
  ul { margin: 0 0 14px; padding-left: 22px; }
  li { margin-bottom: 6px; }
  p > code, li > code { font-size: 0.85em; background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }

  /* Two columns, the right one pinned while the left one scrolls past it - the same
     mechanism modelviewer.dev uses for its live model. Stacks to one column, viewer
     first, under a narrow viewport. */
  /* Edge to edge, no outer gutter and no max-width cap - modelviewer.dev's own
     `.sample` grid runs the full viewport width; the 40px/60px breathing room a
     reader needs comes from padding on the text column alone, and the viewer column
     gets none, so it can go flush to the page edge with nothing to mark where it
     starts. */
  .page { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
  /* A grid track defaults to its content's min-content width, and the embed <pre> below
     doesn't wrap - without this, that unbreakable code line would refuse to shrink the
     track past its own width, so on a narrow viewport the whole row (viewer included)
     overflows past the screen instead of the code block scrolling on its own. */
  .col-text, .col-viewer { min-width: 0; }
  .col-text { padding: 40px 60px; }

  h1 {
    display: flex; align-items: center; gap: 12px;
    font: 400 2.16rem/1.2 var(--font-sans); margin: 0;
  }
  h1 .mark { width: 32px; height: 32px; color: var(--accent); flex-shrink: 0; }

  /* The tagline and every section title share one size and weight - modelviewer.dev
     runs both through the same <h3>, so a reader's eye doesn't have to learn a second
     heading style partway down the page. Only the *later* sections get the dividing
     line underneath; the first one after the tagline reads fine without it. */
  h3 {
    font: 400 1.575rem/1.35 var(--font-sans); margin: 28px 0 10px; color: var(--text);
  }
  h3.tagline { margin-top: 14px; color: var(--text-2); font-weight: 400; }
  h3.bordered { margin-top: 44px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }


  pre {
    margin: 10px 0 16px; padding: 12px 16px; background: var(--code-bg); border-radius: 8px;
    overflow-x: auto; font-size: 14.4px; line-height: 1.65;
  }

  /* A native <select>, styled just enough to sit in the page's own font and colour -
     no custom chevron this time. (An earlier version of this page hand-drew one as a
     background-image, and without an explicit `background-size` it scaled like
     `contain` against the whole padding box, blowing a 12px glyph up to the select's
     own height and burying it under the option text. The native arrow has none of
     that failure mode, and looks right in this plainer design anyway.) */
  .select-plain {
    font: 500 14px/1.3 var(--font-mono); color: var(--text); background: #fff;
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; cursor: pointer;
  }
  .select-plain:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #inputs { display: block; height: 84px; width: auto; max-width: 100%; border-radius: 6px; margin: 4px 0 8px; }
  .provenance { color: var(--text-2); }

  /* --- the viewer itself - mechanics unchanged from before, restyled to match --- */
  .viewer-sticky { position: sticky; top: 32px; }
  /* This has to come after the rule above: same specificity, so whichever is later in
     the stylesheet wins regardless of the media condition, and a mobile override placed
     earlier would silently lose to it. */
  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; gap: 0; }
    .col-text { padding: 32px 20px 64px; }
    .col-viewer { order: -1; margin-bottom: 32px; }
    .viewer-sticky { position: static; }
  }
  /* White, borderless, unrounded - the same white the page itself sits on, so there
     is no box for the eye to find. modelviewer.dev's own model has no frame either;
     it just floats on the page. */
  #stage {
    position: relative; aspect-ratio: 1516 / 944; width: 100%;
    background: #ffffff; overflow: hidden;
  }
  #stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #stage.live #canvas { cursor: grab; }
  #stage.live #canvas.shs-dragging { cursor: grabbing; }
  #canvas:focus, #canvas:focus-visible { outline: none; }

  /* The progress sits at the foot of the stage rather than over the middle of it: the
     subject is the point of the poster, and a bar across its face hides exactly what
     the visitor came to look at. The gradient fades to white now, not to black. */
  #progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: grid; justify-items: center; gap: 8px; padding: 20px 16px 16px;
    background: linear-gradient(transparent, rgba(255, 255, 255, 0.92));
    text-align: center; transition: opacity 0.3s ease;
  }
  #progress span { color: var(--text-2); font: 12px/1.4 var(--font-mono); }
  #bar { width: 220px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.15s linear; }
  #progress.failed span { color: #d32f2f; }
  #progress.failed #bar { display: none; }

  /* Syntax colouring, written into the markup by hand - a highlighter library would
     be the page's only dependency, for a handful of lines of code. */
  .t { color: var(--c-tag); }
  .a { color: var(--c-attr); }
  .s { color: var(--c-str); }
  .k { color: var(--c-kw); }
  .punct { color: var(--c-punct); }
</style>
</head>
<body>
<div class="page">
  <div class="col-text">
    <h1>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
      </svg>
      snap3d
    </h1>
    <h3 class="tagline">사진을 웹 3D 모델로 변환</h3>

    <h3>About</h3>
    <p>
      다양한 각도에서 촬영한 사진들을 기반으로 snap3d 소프트웨어가
      <a class="link-underline" href="https://github.com/teo646/snap3d-viewer/tree/main/demo/snap3d_bundles">.snap3d</a>
      bundle을 만듭니다. 간단한 js 코드로 번들을 웹에서 렌더링하세요.
    </p>
    <pre><code id="embed-code"></code></pre>

    <h3 class="bordered">Demo</h3>
    <p>
      <select id="subject" class="select-plain" aria-label="subject to render"></select>
    </p>
    <img id="inputs" alt="" decoding="async">
    <p class="provenance"><span id="capture"></span>장의 이미지로 bundle 생성</p>

    <h3 class="bordered">Contact for snap3d software</h3>
    <p>
      한양대학교 컴퓨터소프트웨어학부 최태영<br>
      <a href="mailto:tyul0529@naver.com">tyul0529@naver.com</a> · 010-9237-0934
    </p>
  </div>

  <div class="col-viewer">
    <div class="viewer-sticky">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="progress"><div id="bar"><i></i></div><span id="status">starting…</span></div>
      </div>
    </div>
  </div>
</div>

<script src="./dist/viewer.js"></script>
<script>
  // The viewer's `background` option is [r, g, b] in 0-1, WebGL's own convention -
  // pure white, the same white the page itself sits on, so the live render's clear
  // colour disappears into the page rather than marking where the stage begins.
  const STAGE_BACKGROUND = [1, 1, 1];

  // Three runs from the pipeline, each a `<name>.snap3d` folder copied in as it stands.
  // The bundle folder, the poster and the input stack are all named from `name`.
  const BUNDLES = [
    { name: 'boots', label: 'boots', images: 114 },
    { name: 'model_house', label: 'model house', images: 49 },
    { name: 'framed_painting', label: 'framed painting', images: 80 },
  ];

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const progress = $('progress');
  const status = $('status');
  const subjectSelect = $('subject');

  // The folder itself - what the library takes and what the bundle link points at.
  // `loadBundle` appends `/config.json` to any URL that doesn't already end in
  // `.json`, so the folder is also everything a caller needs to pass in.
  const bundleDir = (name) => `./bundle/${name}.snap3d`;
  // The raw config, for the two places on this page that read it themselves rather
  // than handing the URL to the library.
  const configUrl = (name) => `${bundleDir(name)}/config.json`;
  const posterUrl = (name) => `./posters/${name}.webp`;
  const inputsUrl = (name) => `./inputs/${name}.webp`;

  // Coloured the same way the rest of the page's code is - by hand, so a highlighter
  // library is not the cost of a few lines of markup.
  const embedSnippet = (name) => `<span class="punct">&lt;</span><span class="t">script</span> <span class="a">src</span><span class="punct">=</span><span class="s">"https://teo646.github.io/snap3d-viewer/dist/viewer.js"</span><span class="punct">&gt;&lt;/</span><span class="t">script</span><span class="punct">&gt;</span>
<span class="punct">&lt;</span><span class="t">script</span><span class="punct">&gt;</span>
  <span class="k">new</span> Snap3dViewer<span class="punct">(</span>viewer<span class="punct">,</span> <span class="s">'${name}.snap3d'</span><span class="punct">);</span>
<span class="punct">&lt;/</span><span class="t">script</span><span class="punct">&gt;</span>`;

  let current = BUNDLES.find((b) => b.name === new URLSearchParams(location.search).get('bundle')) ?? BUNDLES[0];
  let viewer = null;
  let prefetching = null; // AbortController for the background fetches, if any

  const fail = (error) => {
    progress.hidden = false;
    progress.classList.add('failed');
    status.textContent = String(error?.message ?? error);
    console.error(error);
  };

  const renderEmbed = () => {
    $('embed-code').innerHTML = embedSnippet(current.name);
  };

  /**
   * Centre and fill the stage with whatever the bundle drew.
   *
   * The pose in config.json is the one the pipeline picked for a 1280x800 window, and
   * this stage is neither that size nor that shape, so it tends to leave the surface
   * small and hugging one edge. Rather than hard-code an offset per bundle - there are
   * three here, with different up vectors and extents - read back the frame, take the
   * bounding box of everything that is not background, and pan and zoom until it sits
   * in the middle at a comfortable size. Two passes: the first is approximate because
   * zooming changes what is visible, the second settles it. Purely presentational: the
   * library still opens every bundle on its shipped pose, and this is also the framing
   * the posters were captured at.
   */
  function fitToView(v, fill = 0.86) {
    const gl = v.gl;
    const { width, height } = v.canvas;
    if (!width || !height) return;
    const pixels = new Uint8Array(width * height * 4);

    for (let pass = 0; pass < 2; pass++) {
      v.renderFrame();
      gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

      // The background is now pure white (255,255,255); anything meaningfully darker
      // or more saturated than that is surface. (Was "brighter than a dark
      // background" before the page flipped to a light one - same idea, flipped.)
      let minX = width, maxX = -1, minY = height, maxY = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
          if (Math.max(r, g, b) - Math.min(r, g, b) > 12 || Math.min(r, g, b) < 210) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return; // nothing drawn - leave the shipped pose alone

      // readPixels is bottom-up, which is also the sign convention of `up` below.
      const offsetX = (minX + maxX) / 2 / width - 0.5;
      const offsetY = (minY + maxY) / 2 / height - 0.5;
      const halfHeight = v.camera.radius * Math.tan((v.config.initial_camera.fov_deg * Math.PI) / 360);
      const halfWidth = halfHeight * (width / height);

      const [right, up] = v.camera.forwardAxes;
      const target = v.camera.origin.map(
        (c, i) => c + 2 * offsetX * halfWidth * right[i] + 2 * offsetY * halfHeight * up[i],
      );
      const occupancy = Math.max((maxX - minX) / width, (maxY - minY) / height);
      v.setCamera({ target, radius: v.camera.radius * (occupancy / fill) });
    }
  }

  /**
   * Pull the other bundles into the HTTP cache, one at a time, after the one on screen
   * is drawn. Switching subject then costs a decode rather than a download.
   *
   * Sequential and low priority on purpose: parallel 12 MB streams would fight the
   * bundle the visitor is actually waiting for. Skipped entirely when the browser says
   * the connection is metered or slow - that much speculation is a rude thing to put
   * on someone's data plan for a subject they may never click.
   */
  async function prefetchOthers() {
    const link = navigator.connection;
    if (link?.saveData || /(^|-)2g$/.test(link?.effectiveType ?? '')) return;

    prefetching?.abort();
    const controller = (prefetching = new AbortController());
    for (const bundle of BUNDLES) {
      if (bundle.name === current.name) continue;
      const url = configUrl(bundle.name);
      try {
        const config = await fetch(url, { signal: controller.signal }).then((r) => r.json());
        const base = url.slice(0, url.lastIndexOf('/'));
        for (const key of ['mesh', 'sh', 'height']) {
          // Read the body to completion: a response left unread is not cached.
          await fetch(`${base}/${config.files[key]}`, { signal: controller.signal, priority: 'low' })
            .then((r) => r.arrayBuffer());
        }
      } catch {
        if (controller.signal.aborted) return; // a click won; it will restart after
      }
    }
  }

  function settle() {
    fitToView(viewer);
    // R should return to what the visitor first saw, not to the pose the fit moved
    // away from - here, that is also the frame the poster shows.
    viewer.setHome();
    progress.hidden = true;
    stage.classList.add('live');
    prefetchOthers();
  }

  function onReadyFailed() {} // onError already reported it; this only stops the rejection

  function render() {
    progress.classList.remove('failed');
    progress.hidden = false;
    status.textContent = 'loading…';
    try {
      // Both calls below pass the bundle's folder, not its config.json - the library
      // resolves that itself, exactly as the embed snippet above demonstrates.
      if (viewer) {
        viewer.load(bundleDir(current.name), { poster: posterUrl(current.name) }).then(settle, onReadyFailed);
        return;
      }
      viewer = new Snap3dViewer(canvas, bundleDir(current.name), {
        background: STAGE_BACKGROUND,
        poster: posterUrl(current.name),
        onProgress: (loaded, total) => {
          $('bar').firstElementChild.style.width = `${(loaded / total) * 100}%`;
          status.textContent =
            loaded < total
              ? `${(loaded / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB`
              : 'decompressing…';
        },
        onError: fail,
      });
      window.viewer = viewer; // a console handle, and what the smoke test drives
      viewer.ready.then(settle, onReadyFailed);
    } catch (error) {
      fail(error);
    }
  }

  /** Re-point every part of the page at one subject: what went in, the bundle it
   *  became, the line that embeds it, and the render it produces. */
  function select(bundle) {
    if (bundle.name === current.name && viewer) return;
    current = bundle;
    // Anything speculative loses to what the visitor just asked for.
    prefetching?.abort();
    subjectSelect.value = bundle.name;

    $('inputs').src = inputsUrl(bundle.name);
    $('inputs').alt = `Eight of the ${bundle.images} images the ${bundle.label} was fit from`;
    $('capture').textContent = bundle.images;
    renderEmbed();

    stage.classList.remove('live');
    render();
  }

  for (const bundle of BUNDLES) subjectSelect.appendChild(new Option(bundle.label, bundle.name));
  subjectSelect.addEventListener('change', () => {
    select(BUNDLES.find((b) => b.name === subjectSelect.value));
  });
  select(current);
</script>
</body>
</html>
