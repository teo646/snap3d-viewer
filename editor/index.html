<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap3d editor</title>
<meta name="description" content="snap3d 번들의 회전축과 카메라 기본값을 골라 새 config.json을 만드는 도구.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0f'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ff5252' stroke-width='2.5'/%3E%3Ccircle cx='12.5' cy='12.5' r='2.6' fill='%23ff5252'/%3E%3C/svg%3E">
<style>
  /* This page's only job is to pick a bundle and hand the canvas to
     Snap3dViewerEditor - the readout, the transport, the axis overlay and the
     "make config file" dialog are that class's own shadow-DOM UI (see
     ../src/viewer-editor.js), not reimplemented here. Keeping it that way is the
     point: one editing surface, in the library, that any page can drop in instead
     of a second one hand-maintained beside it. */
  :root {
    --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Roboto Mono', monospace;
    --ink: #f2f3f5;
    --ink-2: #9195a0;
    --bg: #0a0b0d;
    --panel: rgba(18, 19, 23, 0.88);
    --line: rgba(255, 255, 255, 0.12);
    --err: #ff8a80;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2147483001; /* above the editor's own panel */
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  #bundle-input {
    flex: 1 1 auto; min-width: 0;
    font: 13px/1.4 var(--font-mono); color: var(--ink); background: #16171b;
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px;
  }
  #bundle-input:focus-visible { outline: 2px solid #ff5252; outline-offset: 2px; }
  #load-btn {
    font: 600 13px/1 var(--font); color: var(--ink); cursor: pointer;
    background: #1a1b20; border: 1px solid var(--line); border-radius: 7px; padding: 9px 14px;
  }
  #load-btn:hover { background: #232429; }
  #load-status {
    flex: none; color: var(--ink-2); font: 12px/1.4 var(--font-mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw;
  }
  #load-status.error { color: var(--err); }
  @media (max-width: 640px) {
    #bar { flex-wrap: wrap; }
    #load-status { max-width: 100%; }
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="snap3d 번들 편집 뷰"></canvas>

<header id="bar">
  <input id="bundle-input" type="text" autocomplete="off" spellcheck="false"
    placeholder=".snap3d 폴더 경로 또는 URL - 예: /snap3d-clothes/bundle/model_in_clothes.snap3d">
  <button id="load-btn" type="button">불러오기</button>
  <span id="load-status" aria-live="polite"></span>
</header>

<script src="../dist/viewer_editor.js"></script>
<script>
(() => {
  const STORAGE_KEY = 'snap3d-editor:lastBundle';
  const input = document.getElementById('bundle-input');
  const status = document.getElementById('load-status');
  const canvas = document.getElementById('canvas');
  let viewer = null;

  function setStatus(text, isError = false) {
    status.textContent = text;
    status.classList.toggle('error', isError);
  }

  function load(rawUrl) {
    const url = rawUrl.trim().replace(/\/+$/, '');
    if (!url) return;
    setStatus('불러오는 중…');
    const opts = {
      onProgress: (loaded, total) => setStatus(`${(loaded / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB`),
      onReady: () => {
        setStatus('불러옴');
        localStorage.setItem(STORAGE_KEY, url);
        const u = new URL(location.href);
        u.searchParams.set('bundle', url);
        history.replaceState(null, '', u);
      },
      onError: (err) => setStatus(String(err?.message ?? err), true),
    };
    if (!viewer) {
      viewer = new Snap3dViewer(canvas, url, opts);
      window.viewer = viewer; // a console handle, same convention as the shipped pages
    } else {
      viewer.load(url).catch(() => {}); // onError above already reported it
    }
  }

  document.getElementById('load-btn').addEventListener('click', () => load(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') load(input.value);
  });

  const params = new URLSearchParams(location.search);
  const initial = params.get('bundle') || localStorage.getItem(STORAGE_KEY) || '';
  input.value = initial;
  if (initial) load(initial);
  else setStatus('불러올 번들 경로를 입력하세요');
})();
</script>
</body>
</html>
